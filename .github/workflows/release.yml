name: tagpr

on:
    push:
        branches: ["main"]
    # 手動実行でも確認したい場合は以下を有効化
    workflow_dispatch:

jobs:
    tagpr:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
            issues: read
        outputs:
            pull_request: ${{ steps.tagpr.outputs.pull_request }}
            tag: ${{ steps.tagpr.outputs.tag }}
            base_tag: ${{ steps.tagpr.outputs.base_tag }}
        steps:
            - uses: actions/checkout@v5
              with:
                  # タグ計算や差分に必要なので深い履歴を取得
                  fetch-depth: 0
                  persist-credentials: false
            - name: Generate token
              id: generate_token
              env:
                  OPENSSL_CONF: /dev/null
              uses: getsentry/action-github-app-token@d4b5da6c5e37703f8c3b3e43abb5705b46e159cc # v3
              with:
                  app_id: ${{ secrets.APP_ID }}
                  private_key: ${{ secrets.APP_PRIVATE_KEY }}

            - id: tagpr
              uses: Songmu/tagpr@v1
              env:
                  GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}

            # デバッグ用（実運用で不要なら削除可）
            - name: Show tagpr outputs
              run: |
                  echo "tag=${{ steps.tagpr.outputs.tag }}"
                  echo "base_tag=${{ steps.tagpr.outputs.base_tag }}"

    prepare-release-pr:
        runs-on: ubuntu-latest
        needs: [tagpr]
        permissions:
            contents: write
        # 「PR が作られた && タグはまだ作られていない」時にだけ動かす
        if: ${{ needs.tagpr.outputs.pull_request != '' && needs.tagpr.outputs.tag == '' }}
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - name: Use PR info
              env:
                PR_JSON: ${{ needs.tagpr.outputs.pull_request }}
              run: |
                echo "PR JSON:"
                # 環境変数をダブルクォーテーションで囲んで呼び出す
                echo "$PR_JSON" | jq .
                echo "BASE TAG: ${{ needs.tagpr.outputs.base_tag }}"
                echo "NEW TAG (should be empty here): '${{ needs.tagpr.outputs.tag }}'"
